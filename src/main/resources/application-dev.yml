#database configurations

spring:
  autoconfigure:
    exclude:
      # Disable local ONNX Transformers embedding (causes OOM on Render free tier)
      - org.springframework.ai.model.transformers.autoconfigure.TransformersEmbeddingModelAutoConfiguration
      # Use CustomEmbeddingModel which supports Gemini (free) and OpenAI compatible APIs
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:querydocs}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  #open ai configurations
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        base-url: ${CHAT_BASE_URL:https://api.groq.com/openai/v1}
        api-key: ${GROQ_API_KEY:${OPENAI_API_KEY}}
        model: ${CHAT_MODEL:openai/gpt-oss-120b}
        temperature: 0.2
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/v1}
        api-key: ${EMBEDDING_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY}}}
        model: ${OPENAI_EMBEDDING_MODEL:gemini-embedding-001}
        options:
          # Match pgvector table dimension (384). gemini-embedding-001 supports 384 dimensions.
          dimensions: ${EMBEDDING_DIMENSIONS:384}

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
        table-name: vector_store_v2
        schema-name: public
        initialize-schema: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB



#app configurations
app:
  rag:
    chunk-size: 700
#    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"


#jwt configurations


jwt:
  secret: ${JWT_SECRET:sdafasfasfasdhfojhascapfdaDHAfbashfabfashfasbfshfdasfhqf}
  expiration: 604800000


bootui:
  enabled: ON


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
